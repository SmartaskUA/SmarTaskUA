events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:5173;
    }

    upstream json_generator {
        server json-generator:5174;
    }

    upstream api {
        server api:8081;
    }

    # Main server block
    server {
        listen 80;
        server_name localhost;

        # Common proxy headers
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SockJS/STOMP notifications (KPI results). The default 4k proxy buffer
        # holds back frames larger than ~4k on this streaming connection, so the
        # buffers are raised here only; every other route keeps the defaults.
        location /api/ws {
            proxy_pass http://api/ws;
            proxy_set_header Host $host;
            proxy_buffer_size 64k;
            proxy_buffers 8 64k;
            proxy_busy_buffers_size 128k;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # API routes
        location /api/ {
            proxy_pass http://api/;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            # problem package uploads (POST /problems/upload); matches the API's multipart limit
            client_max_body_size 10m;
        }

        # JSON Generator routes
        location /json-gen/ {
            proxy_pass http://json_generator/json-gen/;
            proxy_set_header Host localhost;  # Vite accepts localhost
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Main frontend (default)
        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host localhost;  # Vite accepts localhost
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
