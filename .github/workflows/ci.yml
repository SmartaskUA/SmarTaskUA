name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  api-build:
    name: Build & Test Java API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Copy master rules.json
        run: cp config/rules.json src/api/src/main/resources/rules.json

      - name: Build API with Maven
        working-directory: src/api
        run: mvn clean verify

      - name: Run tests
        working-directory: src/api
        run: mvn test

      - name: Check code style (optional)
        working-directory: src/api
        run: mvn checkstyle:check || true
        continue-on-error: true

  frontend-build:
    name: Build & Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run linter
        working-directory: src/frontend
        run: npm run lint || echo "Linter not configured, skipping..."
        continue-on-error: true

      - name: Build production bundle
        working-directory: src/frontend
        run: npm run build

  python-services-check:
    name: Check Python Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Copy master rules.json
        run: cp config/rules.json src/scheduler/rules.json

      - name: Install scheduler dependencies
        working-directory: src/scheduler
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check scheduler syntax
        working-directory: src/scheduler
        run: |
          python -m py_compile RabbitMQClient.py
          python -m py_compile TaskManager.py
          python -m py_compile MongoDBClient.py
          python -c "import algorithms.CSP" || echo "Warning: CSP module check failed"

      - name: Install analyzer dependencies
        working-directory: src/analyzer
        run: |
          pip install -r requirements.txt

      - name: Check analyzer syntax
        working-directory: src/analyzer
        run: |
          python -m py_compile analyze.py
          python -c "import kpiVerification" || echo "Warning: kpiVerification module check failed"
          python -c "import kpiComparison" || echo "Warning: kpiComparison module check failed"

      - name: Run Python linter (optional)
        run: |
          pip install flake8
          flake8 src/scheduler --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 src/analyzer --count --select=E9,F63,F7,F82 --show-source --statistics || true
        continue-on-error: true

      - name: Validate general algorithm rule coverage
        run: python3 scripts/validate_general_rules.py data/problems/SMARTASK_SIMPLE_2025/problem.json

  docker-build-test:
    name: Test Docker Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/api/Dockerfile
          push: false
          tags: smartask/api:test

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/frontend/Dockerfile
          push: false
          tags: smartask/frontend:test

      - name: Build Scheduler image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/scheduler/Dockerfile
          push: false
          tags: smartask/scheduler:test

      - name: Build Analyzer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/analyzer/Dockerfile
          push: false
          tags: smartask/analyzer:test

  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [api-build, frontend-build, python-services-check, docker-build-test]

    steps:
      - name: All checks passed
        run: echo "All CI checks passed successfully!"
